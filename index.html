<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

<!-- PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Listener Pro">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#00aaff">
<meta name="description" content="Real-time AI conversational support tool">

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192x192.png">
<link rel="icon" type="image/x-icon" href="favicon.ico">

<title>Listener Pro</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Share+Tech+Mono&family=Exo+2:wght@300;400;600&display=swap');

:root {
  --green: #00ff88;
  --yellow: #ffdd00;
  --red: #ff3355;
  --blue: #00aaff;
  --bg: #070c12;
  --surface: #0d1824;
  --surface2: #111f2e;
  --border: rgba(255,255,255,0.07);
  --text: #c8d8e8;
  --dim: #3a5568;
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Exo 2', sans-serif;
  height: 100dvh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

body::before {
  content:'';
  position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(0,170,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,170,255,0.025) 1px, transparent 1px);
  background-size: 36px 36px;
  pointer-events:none; z-index:0;
}

#app { position:relative; z-index:1; display:flex; flex-direction:column; height:100dvh; }

header {
  display:flex; align-items:center; justify-content:space-between;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  background: rgba(7,12,18,0.9);
  backdrop-filter: blur(10px);
  flex-shrink: 0;
}
.logo { font-family:'Rajdhani',sans-serif; font-weight:700; font-size:1.3rem; letter-spacing:3px; color:#fff; }
.logo span { color:var(--blue); text-shadow:0 0 16px var(--blue); }
.hdr-btns { display:flex; gap:8px; }
.icon-btn {
  background:var(--surface); border:1px solid var(--border);
  color:var(--dim); border-radius:8px; padding:6px 10px;
  cursor:pointer; font-size:0.95rem; transition:all 0.2s;
}
.icon-btn:hover, .icon-btn.on { border-color:var(--blue); color:var(--blue); box-shadow:0 0 10px rgba(0,170,255,0.2); }

#setup {
  flex:1; display:flex; align-items:center; justify-content:center; padding:24px;
}
.setup-card {
  width:100%; max-width:400px;
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:28px; display:flex; flex-direction:column; gap:16px;
}
.setup-title { font-family:'Rajdhani',sans-serif; font-size:1.2rem; font-weight:600; letter-spacing:2px; color:#fff; }
.setup-note { font-size:0.8rem; color:var(--dim); line-height:1.6; }
.setup-note a { color:var(--blue); text-decoration:none; }
.api-input {
  width:100%; background:var(--bg); border:1px solid var(--border);
  border-radius:10px; padding:12px 14px; color:var(--text);
  font-family:'Share Tech Mono',monospace; font-size:0.85rem; outline:none;
  transition:border-color 0.2s;
}
.api-input:focus { border-color:var(--blue); }
.btn-go {
  background:linear-gradient(135deg,var(--blue),#0055bb);
  border:none; border-radius:10px; padding:13px;
  color:#fff; font-family:'Rajdhani',sans-serif; font-weight:600;
  font-size:1rem; letter-spacing:2px; cursor:pointer; text-transform:uppercase;
  transition:all 0.2s;
}
.btn-go:hover { filter:brightness(1.15); transform:translateY(-1px); }
.btn-test {
  background: var(--surface2); border:1px solid var(--border);
  border-radius:10px; padding:11px; color:var(--dim);
  font-family:'Rajdhani',sans-serif; font-weight:600;
  font-size:0.85rem; letter-spacing:1px; cursor:pointer; text-transform:uppercase;
  transition:all 0.2s;
}
.btn-test:hover { border-color:var(--green); color:var(--green); }

#main {
  flex:1; display:none; flex-direction:column;
  padding:14px 14px 0; gap:12px; overflow:hidden;
}

.modes { display:grid; grid-template-columns:1fr 1fr; gap:10px; flex-shrink:0; }
.mode-btn {
  border:none; border-radius:14px; padding:18px 12px;
  cursor:pointer; font-family:'Rajdhani',sans-serif; font-weight:600;
  font-size:1rem; letter-spacing:1.5px; text-transform:uppercase;
  transition:all 0.18s; display:flex; flex-direction:column;
  align-items:center; gap:4px;
}
.mode-btn.picked { outline:2px solid rgba(255,255,255,0.5); outline-offset:-2px; transform:scale(0.97); }
.mode-btn .mi { font-size:1.4rem; }
.mode-btn .md { font-family:'Exo 2',sans-serif; font-weight:300; font-size:0.65rem; opacity:0.7; text-transform:none; }

.m-s { background:linear-gradient(145deg,#002818,#004025); color:var(--green); border:1px solid rgba(0,255,136,0.18); }
.m-e { background:linear-gradient(145deg,#1e1900,#2e2600); color:var(--yellow); border:1px solid rgba(255,221,0,0.18); }
.m-l { background:linear-gradient(145deg,#200010,#300018); color:var(--red); border:1px solid rgba(255,51,85,0.18); }
.m-b { background:linear-gradient(145deg,#001020,#001830); color:var(--blue); border:1px solid rgba(0,170,255,0.18); }

/* SOUNDBAR — always visible when main is shown */
.soundbar-wrap {
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:10px 12px;
  display:flex; flex-direction:column; gap:6px; flex-shrink:0;
}
.sb-header {
  display:flex; justify-content:space-between; align-items:center;
  font-family:'Share Tech Mono',monospace; font-size:0.65rem; color:var(--dim);
  letter-spacing:1px;
}
#db-out { color:var(--green); font-family:'Share Tech Mono',monospace; font-size:0.65rem; }
#sb-canvas { width:100%; height:48px; display:block; }
.vu-row { display:flex; gap:2px; height:7px; }
.vu-seg { flex:1; border-radius:1px; background:var(--surface2); transition:background 0.08s; }

.transcript {
  flex:1; background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:12px; overflow-y:auto;
  font-family:'Share Tech Mono',monospace; font-size:0.75rem;
  line-height:1.75; color:var(--dim);
  scrollbar-width:thin; scrollbar-color:var(--surface2) transparent;
}
.tl { margin-bottom:3px; }
.tl.ai { color:var(--blue); }
.tl.sys { color:var(--dim); font-style:italic; }

.controls { display:flex; gap:10px; padding-bottom:16px; flex-shrink:0; }
.connect-btn {
  flex:1; background:linear-gradient(135deg,#001525,#002040);
  border:1px solid rgba(0,170,255,0.3); border-radius:12px;
  padding:14px; color:var(--blue);
  font-family:'Rajdhani',sans-serif; font-weight:600;
  font-size:0.95rem; letter-spacing:2px; cursor:pointer;
  text-transform:uppercase; transition:all 0.22s;
  display:flex; align-items:center; justify-content:center; gap:8px;
}
.connect-btn.live { background:linear-gradient(135deg,#180008,#250010); border-color:rgba(255,51,85,0.4); color:var(--red); }
.connect-btn.busy { opacity:0.65; animation:pulse 0.9s ease-in-out infinite; }
@keyframes pulse { 0%,100%{opacity:0.65}50%{opacity:1} }

.hist-btn {
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; padding:14px 16px; color:var(--dim);
  font-size:1rem; cursor:pointer; transition:all 0.2s;
}
.hist-btn:hover { border-color:var(--blue); color:var(--blue); }
.reply-btn {
  background:linear-gradient(135deg,#1a1200,#2a1e00);
  border:1px solid rgba(255,221,0,0.25); border-radius:12px;
  padding:14px 16px; color:var(--dim);
  font-size:1.1rem; cursor:pointer; transition:all 0.2s;
}
.reply-btn:not(:disabled):hover {
  border-color:var(--yellow); color:var(--yellow);
  box-shadow:0 0 14px rgba(255,221,0,0.2);
}
.reply-btn:disabled { opacity:0.25; cursor:not-allowed; }
.reply-btn.active {
  color:var(--yellow); border-color:var(--yellow);
  box-shadow:0 0 14px rgba(255,221,0,0.25);
  animation: replyPulse 0.6s ease-in-out infinite alternate;
}
@keyframes replyPulse {
  from { box-shadow:0 0 8px rgba(255,221,0,0.2); }
  to   { box-shadow:0 0 20px rgba(255,221,0,0.5); }
}

.status {
  text-align:center; font-family:'Share Tech Mono',monospace;
  font-size:0.66rem; color:var(--dim); padding:5px;
  display:flex; align-items:center; justify-content:center; gap:12px;
  letter-spacing:0.8px; flex-shrink:0;
}
.dot { width:5px; height:5px; border-radius:50%; background:var(--dim); display:inline-block; margin-right:5px; }
.dot.on { background:var(--green); box-shadow:0 0 6px var(--green); animation:blink 1.2s ease-in-out infinite; }
.dot.wait { background:var(--yellow); box-shadow:0 0 6px var(--yellow); animation:blink 0.5s ease-in-out infinite; }
@keyframes blink { 0%,100%{opacity:1}50%{opacity:0.25} }

#ghost { position:fixed; inset:0; background:#000; z-index:100; display:none; }
#ghost.on { display:block; }
.gcorner { position:absolute; width:90px; height:90px; cursor:pointer; }
.gcorner.tl{top:0;left:0} .gcorner.tr{top:0;right:0} .gcorner.bl{bottom:0;left:0} .gcorner.br{bottom:0;right:0}
#gflash { position:fixed; inset:0; pointer-events:none; z-index:101; opacity:0; transition:opacity 0.15s; }
#gflash.on { opacity:0.18; }
.clabel {
  font-size:1.6rem; position:absolute;
  pointer-events:none;
}
.gcorner.tl .clabel { top:10px; left:10px; }
.gcorner.tr .clabel { top:10px; right:10px; }
.gcorner.bl .clabel { bottom:10px; left:10px; }
.gcorner.br .clabel { bottom:10px; right:10px; }
#ghost-exit {
  position:absolute; bottom:40px; left:50%; transform:translateX(-50%);
  background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.2);
  border-radius:12px; padding:12px 28px;
  color:rgba(255,255,255,0.5); font-family:'Rajdhani',sans-serif;
  font-weight:600; font-size:0.95rem; letter-spacing:2px;
  cursor:pointer; text-transform:uppercase; transition:all 0.2s;
}
#ghost-exit:hover { background:rgba(255,255,255,0.15); color:#fff; }

#hist-panel {
  position:fixed; inset:0; background:rgba(0,0,0,0.88);
  backdrop-filter:blur(8px); z-index:50;
  display:none; flex-direction:column; padding:18px; gap:14px; overflow-y:auto;
}
#hist-panel.on { display:flex; }
.ph { display:flex; align-items:center; justify-content:space-between; }
.pt { font-family:'Rajdhani',sans-serif; font-size:1.1rem; font-weight:600; letter-spacing:2px; color:#fff; text-transform:uppercase; }
.close-btn {
  background:var(--surface); border:1px solid var(--border); border-radius:8px;
  padding:6px 12px; color:var(--dim); cursor:pointer; font-size:0.82rem;
  font-family:'Rajdhani',sans-serif; letter-spacing:1px; transition:all 0.2s;
}
.close-btn:hover { border-color:var(--red); color:var(--red); }
.scard { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:8px; }
.sdate { font-family:'Share Tech Mono',monospace; font-size:0.7rem; color:var(--dim); }
.sbullet { display:flex; gap:10px; font-size:0.8rem; line-height:1.5; }
.slabel { font-family:'Rajdhani',sans-serif; font-weight:600; font-size:0.72rem; letter-spacing:1px; text-transform:uppercase; min-width:55px; padding-top:2px; }
.slabel.t{color:var(--blue)} .slabel.n{color:var(--yellow)} .slabel.r{color:var(--green)} .slabel.i{color:#cc88ff} .slabel.f{color:#ff9955}
.no-hist { text-align:center; color:var(--dim); font-size:0.82rem; margin-top:40px; }
#tx-panel {
  position:fixed; inset:0; background:rgba(0,0,0,0.93);
  backdrop-filter:blur(8px); z-index:60;
  display:none; flex-direction:column; padding:18px; gap:14px; overflow:hidden;
}
#tx-panel.on { display:flex; }
.tx-header { display:flex; align-items:center; justify-content:space-between; flex-shrink:0; }
.tx-title { font-family:'Rajdhani',sans-serif; font-size:1.1rem; font-weight:600; letter-spacing:2px; color:#fff; text-transform:uppercase; }
.tx-meta { font-family:'Share Tech Mono',monospace; font-size:0.68rem; color:var(--dim); flex-shrink:0; padding:8px 10px; background:var(--surface); border-radius:8px; border:1px solid var(--border); }
.tx-body {
  flex:1; overflow-y:auto; background:var(--surface);
  border:1px solid var(--border); border-radius:12px;
  padding:14px; font-family:'Share Tech Mono',monospace;
  font-size:0.76rem; line-height:1.9; color:var(--dim);
  scrollbar-width:thin; scrollbar-color:var(--surface2) transparent;
  white-space:pre-wrap; word-break:break-word;
}
.tx-line-ai { color:var(--blue); }
.tx-line-sys { color:var(--dim); font-style:italic; }
.view-log-btn {
  background:var(--surface2); border:1px solid var(--border);
  border-radius:8px; padding:7px 12px; color:var(--blue);
  font-family:'Share Tech Mono',monospace; font-size:0.7rem;
  cursor:pointer; transition:all 0.2s; margin-top:4px; width:100%; text-align:left;
}
.view-log-btn:hover { border-color:var(--blue); background:rgba(0,170,255,0.08); }
.hist-footer {
  position:sticky; bottom:0; padding:14px 0 4px;
  background: linear-gradient(transparent, rgba(0,0,0,0.95) 40%);
  margin-top:auto; flex-shrink:0;
}
.back-btn {
  width:100%; background:linear-gradient(135deg,var(--blue),#0055bb);
  border:none; border-radius:12px; padding:15px;
  color:#fff; font-family:'Rajdhani',sans-serif; font-weight:700;
  font-size:1.05rem; letter-spacing:2px; cursor:pointer;
  text-transform:uppercase; transition:all 0.2s;
}
.back-btn:hover { filter:brightness(1.15); transform:translateY(-1px); }
.back-btn:active { transform:translateY(0); }

#toast {
  position:fixed; bottom:72px; left:50%;
  transform:translateX(-50%) translateY(16px);
  background:var(--surface2); border:1px solid var(--border);
  border-radius:10px; padding:9px 16px; font-size:0.8rem; color:var(--text);
  opacity:0; transition:all 0.28s; pointer-events:none;
  white-space:nowrap; z-index:200; font-family:'Share Tech Mono',monospace;
}
#toast.on { opacity:1; transform:translateX(-50%) translateY(0); }
::-webkit-scrollbar{width:3px} ::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:2px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">LISTENER<span>PRO</span></div>
    <div class="hdr-btns">
      <button class="icon-btn" id="ghost-btn">👁</button>
      <button class="icon-btn" id="settings-btn">⚙</button>
    </div>
  </header>

  <div id="setup">
    <div class="setup-card">
      <div class="setup-title">🔑 API KEY</div>
      <div class="setup-note">
        Enter your Google AI Studio key.<br>
        Get one free at <a href="https://aistudio.google.com" target="_blank">aistudio.google.com</a><br><br>
        Stored locally only — never shared.
      </div>
      <input class="api-input" id="api-input" type="password" placeholder="AIza..." autocomplete="off">
      <button class="btn-go" id="go-btn">INITIALIZE →</button>
      <button class="btn-test" id="test-btn">🔍 TEST KEY + LIST MODELS</button>
      <div id="test-out" style="font-family:'Share Tech Mono',monospace;font-size:0.7rem;color:#00ff88;line-height:1.8;display:none;background:#070c12;border-radius:8px;padding:10px;max-height:180px;overflow-y:auto;white-space:pre-wrap;"></div>
    </div>
  </div>

  <div id="main">
    <div class="modes">
      <button class="mode-btn m-s" data-mode="supportive">
        <span class="mi">💚</span><span>Supportive</span>
        <span class="md">Validating short phrases</span>
      </button>
      <button class="mode-btn m-e" data-mode="engaged">
        <span class="mi">💛</span><span>Engaged</span>
        <span class="md">Curious follow-up questions</span>
      </button>
      <button class="mode-btn m-l" data-mode="logical">
        <span class="mi">❤️</span><span>Logical</span>
        <span class="md">Calm objective counter-points</span>
      </button>
      <button class="mode-btn m-b" data-mode="baseline">
        <span class="mi">💙</span><span>Baseline</span>
        <span class="md">De-escalation & mediation</span>
      </button>
    </div>

    <div class="soundbar-wrap">
      <div class="sb-header">
        <span>🎙 MIC LEVEL</span>
        <span id="db-out">— dB</span>
      </div>
      <canvas id="sb-canvas"></canvas>
      <div class="vu-row" id="vu-row"></div>
    </div>

    <div class="transcript" id="transcript">
      <div class="tl sys">// Select a mode and tap CONNECT</div>
    </div>

    <div class="controls">
      <button class="connect-btn" id="conn-btn">
        <span id="conn-ico">🎙</span>
        <span id="conn-lbl">CONNECT</span>
      </button>
      <button class="reply-btn" id="reply-btn" disabled title="Reply Now">⚡</button>
      <button class="hist-btn" id="hist-btn">📋</button>
    </div>

    <div class="status">
      <span><span class="dot" id="cdot"></span><span id="cstat">Disconnected</span></span>
      <span><span class="dot" id="mdot"></span><span id="mstat">Mic: Off</span></span>
      <span id="mode-stat" style="color:var(--dim)">Mode: —</span>
    </div>
  </div>
</div>

<div id="ghost">
  <div class="gcorner tl" data-mode="supportive"><span class="clabel">💚</span></div>
  <div class="gcorner tr" data-mode="engaged"><span class="clabel">💛</span></div>
  <div class="gcorner bl" data-mode="logical"><span class="clabel">❤️</span></div>
  <div class="gcorner br" data-mode="baseline"><span class="clabel">💙</span></div>
  <button id="ghost-exit">✕ EXIT GHOST</button>
</div>
<div id="gflash"></div>

<div id="hist-panel">
  <div class="ph">
    <div class="pt">📋 Session History</div>
    <button class="close-btn" id="close-hist">✕ CLOSE</button>
  </div>
  <div id="hist-list"></div>
  <div class="hist-footer">
    <button class="back-btn" id="back-btn">← BACK TO APP</button>
  </div>
</div>

<div id="tx-panel">
  <div class="tx-header">
    <div class="tx-title">📄 Session Log</div>
    <button class="close-btn" id="close-tx">✕</button>
  </div>
  <div class="tx-meta" id="tx-meta"></div>
  <div class="tx-body" id="tx-body"></div>
  <div class="hist-footer">
    <button class="back-btn" id="back-tx">← BACK TO HISTORY</button>
  </div>
</div>
<div id="toast"></div>

<script>
const MODES = {
  supportive: { label:'SUPPORTIVE', color:'#00ff88', prompt:'You are a supportive spouse. Respond with validation only. Maximum 5 words. Use phrases like "I hear you", "That makes sense". Never advise.' },
  engaged:    { label:'ENGAGED',    color:'#ffdd00', prompt:'You are a curious engaged listener. Ask ONE short follow-up question about details just mentioned. Under 12 words.' },
  logical:    { label:'LOGICAL',    color:'#ff3355', prompt:'You are a calm logical analyst. Gently counter generalizations like always/never. Factual, under 15 words, never combative.' },
  baseline:   { label:'BASELINE',   color:'#00aaff', prompt:'You are a skilled mediator. De-escalate with phrases like "Let\'s take a breath". Under 8 words.' }
};

let apiKey='', mode='supportive', ws=null, audioCtx=null, stream=null;
let processor=null, analyser=null, analyserBuf=null, animFrame=null;
let connected=false, connecting=false, sessionText='';

const G = id => document.getElementById(id);

// Build VU segments
const VU=24;
const vuRow = G('vu-row');
for(let i=0;i<VU;i++){
  const s=document.createElement('div');
  s.className='vu-seg'; s.id='v'+i;
  vuRow.appendChild(s);
}

// Canvas setup
const canvas = G('sb-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const dpr = window.devicePixelRatio||1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);
}

// ── Init ──
function init() {
  const k = localStorage.getItem('lp_key');
  if(k){ apiKey=k; showMain(); }

  G('go-btn').addEventListener('click', saveKey);
  G('test-btn').addEventListener('click', testKey);
  G('api-input').addEventListener('keydown', e => e.key==='Enter' && saveKey());
  G('conn-btn').addEventListener('click', handleConnect);
  G('ghost-btn').addEventListener('click', toggleGhost);
  G('ghost-exit').addEventListener('click', toggleGhost);
  G('settings-btn').addEventListener('click', changeKey);
  G('hist-btn').addEventListener('click', showHistory);
  G('reply-btn').addEventListener('click', replyNow);
  G('close-hist').addEventListener('click', ()=> G('hist-panel').classList.remove('on'));
  G('close-tx').addEventListener('click', ()=> G('tx-panel').classList.remove('on'));
  G('back-tx').addEventListener('click', ()=> G('tx-panel').classList.remove('on'));
  G('back-btn').addEventListener('click', ()=> G('hist-panel').classList.remove('on'));
  document.querySelectorAll('.mode-btn').forEach(b=>b.addEventListener('click',()=>setMode(b.dataset.mode)));
  document.querySelectorAll('.gcorner').forEach(c=>c.addEventListener('click',()=>{setMode(c.dataset.mode);flashGhost(MODES[c.dataset.mode].color);}));
  window.addEventListener('resize', ()=>{ if(analyser) resizeCanvas(); });
}

function saveKey(){
  const v=G('api-input').value.trim();
  if(!v){toast('⚠ Enter your API key');return;}
  apiKey=v; localStorage.setItem('lp_key',v); showMain(); toast('✓ Key saved');
}

function showMain(){
  G('setup').style.display='none';
  G('main').style.display='flex';
  setMode('supportive');
  // Draw empty soundbar placeholder
  setTimeout(()=>{ resizeCanvas(); drawEmpty(); }, 100);
}

function drawEmpty(){
  const W=canvas.offsetWidth, H=canvas.offsetHeight;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle='rgba(0,170,255,0.05)';
  const bw=6, gap=3, count=40;
  for(let i=0;i<count;i++){
    const x=i*(bw+gap);
    ctx.fillRect(x, H-2, bw, 2);
  }
}

async function testKey(){
  const k = G('api-input').value.trim() || apiKey;
  if(!k){ toast('⚠ Enter your API key first'); return; }
  const out = G('test-out');
  out.style.display = 'block';
  out.textContent = '// Fetching available models...\n';
  try {
    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${k}&pageSize=50`);
    const data = await res.json();
    if(data.error){ out.textContent += '// ✗ API Error: ' + data.error.message + '\n'; return; }
    const models = data.models || [];
    const liveModels = models.filter(m => m.supportedGenerationMethods?.includes('bidiGenerateContent'));
    out.textContent += `// Total models: ${models.length}\n`;
    out.textContent += `// Live API capable: ${liveModels.length}\n\n`;
    if(liveModels.length === 0){
      out.textContent += '// ✗ NO LIVE API MODELS FOUND\n';
      out.textContent += '// Your key may not have Live API access.\n';
      out.textContent += '// All models that support generateContent:\n';
      models.filter(m=>m.supportedGenerationMethods?.includes('generateContent')).slice(0,8).forEach(m=>{
        out.textContent += `//   ${m.name}\n`;
      });
    } else {
      out.textContent += '// ✓ USE ONE OF THESE MODEL NAMES:\n';
      liveModels.forEach(m => { out.textContent += `//   ${m.name}\n`; });
    }
  } catch(e) {
    out.textContent += '// ✗ Fetch error: ' + e.message;
  }
}

function changeKey(){
  const k=prompt('New API key (blank=keep):','');
  if(k&&k.trim()){apiKey=k.trim();localStorage.setItem('lp_key',apiKey);toast('✓ Key updated');}
}

function setMode(m){
  mode=m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('picked',b.dataset.mode===m));
  G('mode-stat').textContent='Mode: '+MODES[m].label;
  G('mode-stat').style.color=MODES[m].color;
  toast('→ '+MODES[m].label);
  if(connected&&ws) sendModeUpdate();
}

async function handleConnect(){
  if(connecting)return;
  if(connected){disconnect();return;}
  await doConnect();
}

async function doConnect(){
  connecting=true;
  setBtnState('busy');
  log('// Requesting microphone...');

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio:{ sampleRate:16000, channelCount:1, echoCancellation:true, noiseSuppression:true }
    });
  } catch(e){
    log('// ✗ Mic denied: '+e.message);
    toast('⚠ Mic access denied');
    resetBtn(); return;
  }
  log('// ✓ Mic granted');

  try {
    audioCtx = new (window.AudioContext||window.webkitAudioContext)({sampleRate:16000});
    await audioCtx.resume();
  } catch(e){
    log('// ✗ AudioContext: '+e.message);
    resetBtn(); return;
  }

  // Start soundbar RIGHT AWAY so user sees mic is working
  resizeCanvas();
  startSoundbar();

  log('// Connecting to Gemini Live...');
  const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=${apiKey}`;

  try { ws = new WebSocket(url); ws.binaryType='arraybuffer'; }
  catch(e){ log('// ✗ WS: '+e.message); toast('⚠ Connection failed'); resetBtn(); return; }

  ws.onopen = ()=>{ log('// WS open — sending setup...'); sendSetup(); };
  ws.onmessage = onMsg;
  ws.onerror = e=>{ console.error('WS err',e); log('// ✗ WS error'); disconnect(); };
  ws.onclose = e=>{
    const r=e.reason?`: ${e.reason}`:'';
    log(`// Disconnected (${e.code}${r})`);
    if(connected) endSession();
    resetBtn(); stopSoundbar();
  };
}

function sendSetup(){
  const msg={
    setup:{
      model:'models/gemini-2.5-flash-native-audio-latest',
      generationConfig:{
        responseModalities:['AUDIO'],
        speechConfig:{ voiceConfig:{ prebuiltVoiceConfig:{ voiceName:'Aoede' } } }
      },
      realtimeInputConfig:{
        automaticActivityDetection:{
          disabled: false,
          startOfSpeechSensitivity: 'START_SENSITIVITY_HIGH',
          endOfSpeechSensitivity: 'END_SENSITIVITY_HIGH',
          prefixPaddingMs: 200,
          silenceDurationMs: 1200
        }
      },
      systemInstruction:{ parts:[{text: MODES[mode].prompt}] }
    }
  };
  console.log('Setup →', JSON.stringify(msg));
  ws.send(JSON.stringify(msg));
}

function sendModeUpdate(){
  if(!ws||ws.readyState!==WebSocket.OPEN)return;
  ws.send(JSON.stringify({
    clientContent:{
      turns:[{role:'user',parts:[{text:'[MODE CHANGE] '+MODES[mode].prompt}]}],
      turnComplete:true
    }
  }));
}

function onMsg(event){
  let data;
  try{
    const raw=event.data instanceof ArrayBuffer?new TextDecoder().decode(event.data):event.data;
    data=JSON.parse(raw);
  }catch(e){return;}

  console.log('← Server msg keys:', Object.keys(data));

  if('setupComplete' in data){
    log('// ✓ Connected — speak now!');
    connected=true; connecting=false;
    setBtnState('live');
    startCapture();
    return;
  }

  if(data.serverContent?.modelTurn?.parts){
    data.serverContent.modelTurn.parts.forEach(p=>{
      if(p.text){ log('AI: '+p.text); sessionText+='AI: '+p.text+'\n'; }
      if(p.inlineData?.data) playPCM(p.inlineData.data);
    });
  }
}

function startCapture(){
  if(!audioCtx||!stream)return;
  const src=audioCtx.createMediaStreamSource(stream);
  processor=audioCtx.createScriptProcessor(1024,1,1);
  processor.onaudioprocess=e=>{
    if(!connected||!ws||ws.readyState!==WebSocket.OPEN)return;
    const f32=e.inputBuffer.getChannelData(0);
    const i16=new Int16Array(f32.length);
    for(let i=0;i<f32.length;i++){
      const s=Math.max(-1,Math.min(1,f32[i]));
      i16[i]=s<0?s*0x8000:s*0x7FFF;
    }
    const b64=btoa(String.fromCharCode(...new Uint8Array(i16.buffer)));
    ws.send(JSON.stringify({realtimeInput:{audio:{mimeType:'audio/pcm;rate=16000',data:b64}}}));
  };
  src.connect(processor);
  processor.connect(audioCtx.destination);
  G('mdot').className='dot on';
  G('mstat').textContent='Mic: On';
}

// Audio queue — prevents chunks overlapping and cutting each other off
let audioQueue=[], audioPlaying=false, nextPlayTime=0;

function playPCM(b64){
  if(!audioCtx)return;
  try{
    const bin=atob(b64);
    const bytes=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
    const i16=new Int16Array(bytes.buffer);
    const f32=new Float32Array(i16.length);
    for(let i=0;i<i16.length;i++) f32[i]=i16[i]/32768;
    const buf=audioCtx.createBuffer(1,f32.length,24000);
    buf.copyToChannel(f32,0);
    audioQueue.push(buf);
    if(!audioPlaying) drainQueue();
  }catch(e){ console.error('PCM playback',e); }
}

function drainQueue(){
  if(audioQueue.length===0){ audioPlaying=false; return; }
  audioPlaying=true;
  const buf=audioQueue.shift();
  const src=audioCtx.createBufferSource();
  src.buffer=buf;
  src.playbackRate.value=0.9;
  src.connect(audioCtx.destination);
  const startAt=Math.max(audioCtx.currentTime, nextPlayTime);
  src.start(startAt);
  nextPlayTime=startAt+buf.duration;
  src.onended=drainQueue;
}

function clearAudioQueue(){
  audioQueue=[];
  audioPlaying=false;
  nextPlayTime=0;
}

// ── SOUNDBAR — driven by real AnalyserNode ──
function startSoundbar(){
  if(!audioCtx||!stream)return;
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=256;
  analyser.smoothingTimeConstant=0.8;
  analyserBuf=new Uint8Array(analyser.frequencyBinCount);
  const src=audioCtx.createMediaStreamSource(stream);
  src.connect(analyser);
  drawLoop();
}

function drawLoop(){
  animFrame=requestAnimationFrame(drawLoop);
  if(!analyser||!analyserBuf)return;
  analyser.getByteFrequencyData(analyserBuf);

  const W=canvas.offsetWidth, H=canvas.offsetHeight;
  ctx.clearRect(0,0,W,H);

  // RMS → dB
  let sum=0;
  for(let i=0;i<analyserBuf.length;i++) sum+=(analyserBuf[i]/255)**2;
  const rms=Math.sqrt(sum/analyserBuf.length);
  const db=rms>0?Math.max(-60,20*Math.log10(rms)):-60;
  const dbEl=G('db-out');
  dbEl.textContent=db.toFixed(1)+' dB';
  dbEl.style.color=db>-20?'#ff3355':db>-35?'#ffdd00':'#00ff88';

  // Frequency bars
  const count=36, gap=2;
  const bw=(W-gap*(count-1))/count;
  const step=Math.floor(analyserBuf.length/count);
  for(let i=0;i<count;i++){
    let s=0;
    for(let j=0;j<step;j++) s+=analyserBuf[i*step+j];
    const norm=(s/step)/255;
    const bh=Math.max(2,norm*H*0.95);
    const x=i*(bw+gap);
    const hue=norm<0.5?140:norm<0.78?55:0;
    ctx.fillStyle=`hsla(${hue},88%,50%,${0.45+norm*0.55})`;
    ctx.beginPath();
    if(ctx.roundRect) ctx.roundRect(x,H-bh,bw,bh,[2,2,0,0]);
    else ctx.rect(x,H-bh,bw,bh);
    ctx.fill();
  }

  // VU meter
  const lit=Math.round(((db+60)/60)*VU);
  for(let i=0;i<VU;i++){
    const seg=G('v'+i);
    if(!seg)continue;
    if(i<lit) seg.style.background=i<VU*0.6?'#00ff88':i<VU*0.82?'#ffdd00':'#ff3355';
    else seg.style.background='var(--surface2)';
  }
}

function stopSoundbar(){
  if(animFrame){cancelAnimationFrame(animFrame);animFrame=null;}
  if(analyser){analyser.disconnect();analyser=null;}
  G('db-out').textContent='— dB';
  const W=canvas.offsetWidth,H=canvas.offsetHeight;
  ctx.clearRect(0,0,W,H);
  drawEmpty();
  for(let i=0;i<VU;i++){const s=G('v'+i);if(s)s.style.background='var(--surface2)';}
}

function disconnect(){
  connected=false; connecting=false;
  clearAudioQueue();
  if(ws){try{ws.close();}catch(e){} ws=null;}
  if(processor){processor.disconnect();processor=null;}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  stopSoundbar();
  G('mdot').className='dot'; G('mstat').textContent='Mic: Off';
  if(sessionText.trim()) endSession();
  resetBtn();
}

function resetBtn(){
  connecting=false; connected=false;
  G('conn-btn').className='connect-btn';
  G('conn-ico').textContent='🎙'; G('conn-lbl').textContent='CONNECT';
  G('cdot').className='dot'; G('cstat').textContent='Disconnected';
  G('reply-btn').disabled=true; G('reply-btn').classList.remove('active');
}

function setBtnState(s){
  if(s==='busy'){
    G('conn-btn').className='connect-btn busy';
    G('conn-ico').textContent='⟳'; G('conn-lbl').textContent='CONNECTING...';
    G('cdot').className='dot wait'; G('cstat').textContent='Connecting...';
  } else if(s==='live'){
    G('conn-btn').className='connect-btn live';
    G('conn-ico').textContent='⏹'; G('conn-lbl').textContent='DISCONNECT';
    G('cdot').className='dot on'; G('cstat').textContent='Connected';
    G('reply-btn').disabled=false;
  }
}

async function endSession(){
  const txt=sessionText; sessionText='';
  if(!txt.trim())return;
  log('// Generating session summary...');
  const prompt=`You are an expert relationship counselor analyzing a conversation transcript.
The transcript is from an AI assistant responding to someone talking about their relationship or situation.
Study the transcript carefully and respond with ONLY a valid JSON object — no markdown, no backticks, no explanation.

JSON format:
{
  "topic": "One specific sentence describing exactly what was being discussed (e.g. 'Partner felt ignored during dinner plans disagreement')",
  "tone": "2-3 words describing the emotional tone detected (e.g. 'frustrated but open' or 'tense and defensive')",
  "repair": "One specific, actionable repair phrase tailored to this exact conversation (e.g. 'Acknowledge you heard their concern about the trip planning')",
  "insight": "One sentence of specific insight about the dynamic in this conversation",
  "followup": "One concrete suggested next step for this specific situation"
}

IMPORTANT RULES:
- You MUST respond with ONLY the raw JSON object. 
- Do NOT include any text before or after the JSON.
- Do NOT use markdown code blocks.
- Do NOT include backticks of any kind.
- Start your response with { and end with }

Transcript:
${txt.slice(0,3000)}`;

  try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`,{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        contents:[{parts:[{text:prompt}]}],
        generationConfig:{ temperature:0.4, maxOutputTokens:512 }
      })
    });
    const d=await res.json();
    console.log('Summary API response:', JSON.stringify(d));
    let summary=null;
    const raw=(d.candidates?.[0]?.content?.parts?.[0]?.text||'');
    console.log('Raw summary text:', raw);
    try{
      const cleaned=raw.replace(/```json/g,'').replace(/```/g,'').trim();
      summary=JSON.parse(cleaned);
    }catch(e){
      console.error('JSON parse failed:', e, 'Raw:', raw);
      // Try extracting JSON from within the text
      const match=raw.match(/\{[\s\S]*\}/);
      if(match){ try{ summary=JSON.parse(match[0]); }catch(e2){} }
    }
    if(!summary){
      // Best-effort: extract something meaningful from the raw transcript
      const aiLines = txt.split('\n').filter(l=>l.startsWith('AI:')).map(l=>l.replace('AI:','').trim());
      const firstAI = aiLines[0] || '';
      const guessedTopic = firstAI.length>10 ? 'Discussed: ' + firstAI.slice(0,80) : 'Conversation session — see log for details';
      summary={
        topic: guessedTopic,
        tone: 'see log',
        repair: 'Review the full session log for context',
        insight: raw.length>20 ? raw.slice(0,120).replace(/[{}"]/g,'').trim() : 'Review log for details',
        followup: ''
      };
    }
    saveSession(summary,txt); toast('✓ Session saved');
  }catch(e){
    console.error('endSession error:', e);
    saveSession({topic:'Network error generating summary',tone:'unknown',repair:'Try again next session',insight:'',followup:''},txt);
  }
}

function saveSession(summary,txt){
  const sessions=JSON.parse(localStorage.getItem('lp_sessions')||'[]');
  sessions.unshift({date:new Date().toLocaleString(),summary,transcript:txt});
  if(sessions.length>20)sessions.pop();
  localStorage.setItem('lp_sessions',JSON.stringify(sessions));
}

function showHistory(){
  const sessions=JSON.parse(localStorage.getItem('lp_sessions')||'[]');
  const hl=G('hist-list'); hl.innerHTML='';
  if(!sessions.length){hl.innerHTML='<div class="no-hist">No sessions yet.</div>';}
  else sessions.forEach(s=>{
    const sc=document.createElement('div'); sc.className='scard';
    const ins=s.summary.insight?`<div class="sbullet"><span class="slabel i">INSIGHT</span><span>${s.summary.insight}</span></div>`:'';
    const fu=s.summary.followup?`<div class="sbullet"><span class="slabel f">NEXT</span><span>${s.summary.followup}</span></div>`:'';
    sc.innerHTML=`<div class="sdate">📅 ${s.date}</div>
      <div class="sbullet"><span class="slabel t">TOPIC</span><span>${s.summary.topic}</span></div>
      <div class="sbullet"><span class="slabel n">TONE</span><span>${s.summary.tone}</span></div>
      ${ins}
      <div class="sbullet"><span class="slabel r">REPAIR</span><span>"${s.summary.repair}"</span></div>
      ${fu}
      ${s.transcript?'<button class="view-log-btn">📄 View Full Session Log</button>':''}`;
    if(s.transcript){
      sc.querySelector('.view-log-btn').addEventListener('click', ()=> openTranscript(s));
    }
    hl.appendChild(sc);
  });
  G('hist-panel').classList.add('on');
}

function openTranscript(s){
  const lines = s.transcript.split('\n').filter(l=>l.trim());
  const meta = `Date: ${s.date}   Lines: ${lines.length}   Topic: ${s.summary.topic}`;
  G('tx-meta').textContent = meta;

  // Render lines with color coding
  const body = G('tx-body');
  body.innerHTML = '';
  lines.forEach(line => {
    const div = document.createElement('div');
    if(line.startsWith('AI:')){ div.className='tx-line-ai'; div.textContent=line; }
    else if(line.startsWith('//')){ div.className='tx-line-sys'; div.textContent=line; }
    else { div.textContent=line; }
    body.appendChild(div);
  });
  body.scrollTop=0;
  G('tx-panel').classList.add('on');
}

function replyNow(){
  if(!connected||!ws||ws.readyState!==WebSocket.OPEN) return;

  const btn = G('reply-btn');
  btn.classList.add('active');
  log('// ⚡ Reply now triggered...');

  // Send an audioStreamEnd to signal end of user turn — forces Gemini to respond now
  ws.send(JSON.stringify({ realtimeInput:{ audioStreamEnd: true } }));

  // After brief pause, re-open the audio stream by sending a silent frame
  // so mic capture continues seamlessly
  setTimeout(()=>{
    btn.classList.remove('active');
    log('// 🎙 Resumed listening');
    // Re-signal audio is flowing again by sending a tiny silent PCM chunk
    if(audioCtx && stream){
      const silent = new Int16Array(1024); // all zeros = silence
      const b64 = btoa(String.fromCharCode(...new Uint8Array(silent.buffer)));
      ws.send(JSON.stringify({
        realtimeInput:{ audio:{ mimeType:'audio/pcm;rate=16000', data:b64 } }
      }));
    }
  }, 800);
}

function toggleGhost(){
  const on=G('ghost').classList.toggle('on');
  G('ghost-btn').classList.toggle('on',on);
  toast(on?'👁 Ghost Mode ON':'👁 Ghost Mode OFF');
}

function flashGhost(color){
  const gf=G('gflash');
  gf.style.background=color;
  gf.classList.add('on');
  setTimeout(()=>gf.classList.remove('on'),280);
}

function log(text){
  const d=document.createElement('div');
  d.className='tl sys'; d.textContent=text;
  G('transcript').appendChild(d);
  G('transcript').scrollTop=G('transcript').scrollHeight;
}

function toast(msg){
  const el=G('toast'); el.textContent=msg;
  el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'),2400);
}

init();

// Register service worker for PWA
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(() => console.log('SW registered'))
      .catch(e => console.log('SW failed:', e));
  });
}
